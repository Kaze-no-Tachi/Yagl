name: yagl
description: "Yagl — personal game & hardware library tracker (mobile + web)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # State management
  flutter_riverpod: ^2.5.1
  # HTTP
  dio: ^5.4.0
  # Secure JWT storage (works on iOS, Android, web)
  flutter_secure_storage: ^9.0.0
  # Barcode scanning (mobile); web falls back to manual entry
  mobile_scanner: ^5.0.0
  # Photo capture / pick
  image_picker: ^1.0.7
  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
